[project]
name = "research-agent"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ahmeterdem1", email = "ahmetblk1035@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "chardet>=7.6.0",
    "docling>=2.129.0",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.141.1",
    "fastmcp>=4.0.5",
    "litellm>=1.102.0",
    "mcp>=2.2.0",
    "pyalex>=0.21",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "semanticscholar>=0.12.0",
    "tenacity>=9.0.0",
    "uvicorn>=0.53.0",
    "onnxruntime-gpu>=1.19.0 ; sys_platform == 'win32' or sys_platform == 'linux'",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
research-agent = "src.research_agent:main"
ra-cli = "src.research_agent:main"
ra-mcp-docs = "src.research_agent:mcp_docs"
ra-mcp-search = "src.research_agent:mcp_search"
ra-mcp-ingest = "src.research_agent:mcp_ingest"
ra-mcp-kg = "src.research_agent:mcp_kg"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["src", "config", "scripts"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
